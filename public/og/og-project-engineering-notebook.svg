<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Clean white background -->
  <rect width="1200" height="630" fill="#ffffff"/>

  <!-- Left boundary margin line suggesting notebook binding -->
  <line x1="80" y1="0" x2="80" y2="630" stroke="#f1f5f9" stroke-width="2"/>
  <line x1="86" y1="0" x2="86" y2="630" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Left Header Content -->
  <g transform="translate(130, 110)">
    <!-- Small blue eyebrow -->
    <text x="0" y="0" fill="#2563eb" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700" letter-spacing="4">ENGINEERING NOTEBOOK</text>
    
    <!-- Ink-black headline -->
    <text x="0" y="65" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="58" font-weight="800" letter-spacing="-1">Notes with receipts.</text>
    <text x="0" y="105" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400">Architectural decisions, failure postmortems &amp; verified benchmarks</text>
  </g>

  <!-- Three Thin Horizontal Article Rows Suggesting a Notebook Index -->
  <g transform="translate(130, 265)">
    <!-- Row 1 -->
    <g transform="translate(0, 0)">
      <line x1="0" y1="0" x2="940" y2="0" stroke="#e2e8f0" stroke-width="1.5"/>
      <text x="10" y="42" fill="#2563eb" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', Consolas, monospace" font-size="18" font-weight="700">#01</text>
      <!-- Title bar -->
      <text x="80" y="42" fill="#1e293b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="600">Deterministic DAG Orchestration vs. LLM Agent Loops</text>
      <!-- Meta line -->
      <text x="940" y="42" text-anchor="end" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', Consolas, monospace" font-size="16">BENCHMARK · 12 MIN</text>
    </g>

    <!-- Row 2 -->
    <g transform="translate(0, 80)">
      <line x1="0" y1="0" x2="940" y2="0" stroke="#e2e8f0" stroke-width="1.5"/>
      <text x="10" y="42" fill="#2563eb" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', Consolas, monospace" font-size="18" font-weight="700">#02</text>
      <!-- Title bar -->
      <text x="80" y="42" fill="#1e293b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="600">Zero-Downtime Schema Evolutions in High-Throughput Streams</text>
      <!-- Meta line -->
      <text x="940" y="42" text-anchor="end" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', Consolas, monospace" font-size="16">POSTMORTEM · 8 MIN</text>
    </g>

    <!-- Row 3 -->
    <g transform="translate(0, 160)">
      <line x1="0" y1="0" x2="940" y2="0" stroke="#e2e8f0" stroke-width="1.5"/>
      <text x="10" y="42" fill="#2563eb" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', Consolas, monospace" font-size="18" font-weight="700">#03</text>
      <!-- Title bar -->
      <text x="80" y="42" fill="#1e293b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="600">Cost-Optimizing Multi-Modal Vector Indices at Scale</text>
      <!-- Meta line -->
      <text x="940" y="42" text-anchor="end" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', Consolas, monospace" font-size="16">CASE STUDY · 15 MIN</text>
      <line x1="0" y1="75" x2="940" y2="75" stroke="#e2e8f0" stroke-width="1.5"/>
    </g>
  </g>

  <!-- Bottom Brand Footer -->
  <g transform="translate(130, 560)">
    <text x="0" y="0" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700">eManisha</text>
    <text x="95" y="0" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18">|</text>
    <text x="115" y="0" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16">Technical Field Notes &amp; Engineering Systems</text>
  </g>
</svg>
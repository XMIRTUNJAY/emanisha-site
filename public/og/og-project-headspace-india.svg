<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Warm cream background -->
  <rect width="1200" height="630" fill="#faf4e8"/>

  <!-- Concentric breath/radial sun circle motif centered -->
  <g transform="translate(600, 240)">
    <!-- Outer concentric breath ripples -->
    <circle cx="0" cy="0" r="160" fill="none" stroke="#b25a36" stroke-width="1" stroke-opacity="0.12" stroke-dasharray="3 5"/>
    <circle cx="0" cy="0" r="125" fill="none" stroke="#b25a36" stroke-width="1.5" stroke-opacity="0.22"/>
    <circle cx="0" cy="0" r="90" fill="none" stroke="#b25a36" stroke-width="2" stroke-opacity="0.38"/>
    <!-- Subtle rhythmic radial ray ticks around the breath ring -->
    <g stroke="#b25a36" stroke-width="2" stroke-linecap="round" stroke-opacity="0.45">
      <line x1="0" y1="-75" x2="0" y2="-65"/>
      <line x1="53" y1="-53" x2="46" y2="-46"/>
      <line x1="75" y1="0" x2="65" y2="0"/>
      <line x1="53" y1="53" x2="46" y2="46"/>
      <line x1="0" y1="75" x2="0" y2="65"/>
      <line x1="-53" y1="53" x2="-46" y2="46"/>
      <line x1="-75" y1="0" x2="-65" y2="0"/>
      <line x1="-53" y1="-53" x2="-46" y2="-46"/>
    </g>
    <!-- Core terracotta warm sun disc -->
    <circle cx="0" cy="0" r="48" fill="#b25a36"/>
    <!-- Inner calm focal dot -->
    <circle cx="0" cy="0" r="14" fill="#faf4e8"/>
  </g>

  <!-- Typography with generous whitespace -->
  <g transform="translate(600, 450)">
    <!-- Small caps eyebrow text -->
    <text x="0" y="0" text-anchor="middle" fill="#b25a36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" letter-spacing="8">DHYAANA</text>
    
    <!-- Headline -->
    <text x="0" y="55" text-anchor="middle" fill="#2d2a26" font-family="Georgia, Cambria, 'Times New Roman', serif" font-size="46" font-weight="400" letter-spacing="-0.5">A calmer digital space.</text>
    
    <!-- Subtitle / Meta -->
    <text x="0" y="95" text-anchor="middle" fill="#8c7e73" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" letter-spacing="1.5">MINDFULNESS FOR DIGITAL WELLBEING</text>
  </g>

  <!-- Bottom Brand credit -->
  <g transform="translate(600, 580)">
    <text x="0" y="0" text-anchor="middle" fill="#b25a36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" letter-spacing="2">HEADSPACE INDIA · eMANISHA</text>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1d3b63" stroke-width="1" stroke-opacity="0.35"/>
    </pattern>
    <radialGradient id="glow" cx="80%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0a2540" stop-opacity="0"/>
    </radialGradient>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Deep navy background -->
  <rect width="1200" height="630" fill="#0a2540"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Left Content Area -->
  <g transform="translate(100, 180)">
    <!-- Eyebrow -->
    <text x="0" y="0" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="4">AI BUILDER / DATA ENGINEER</text>
    
    <!-- Headline -->
    <text x="0" y="80" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="64" font-weight="800" letter-spacing="-1">Pipelines with a pulse.</text>
    <text x="0" y="145" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="400">Autonomous data systems &amp; intelligent agents</text>
  </g>

  <!-- Right Side: Minimal Glowing Blue Line-Chart Motif -->
  <g transform="translate(680, 180)">
    <!-- Chart axes / subtle guide lines -->
    <line x1="0" y1="260" x2="420" y2="260" stroke="#1e3a5f" stroke-width="1.5"/>
    <line x1="0" y1="180" x2="420" y2="180" stroke="#1e3a5f" stroke-width="1" stroke-dasharray="4 4" stroke-opacity="0.5"/>
    <line x1="0" y1="100" x2="420" y2="100" stroke="#1e3a5f" stroke-width="1" stroke-dasharray="4 4" stroke-opacity="0.5"/>
    <line x1="0" y1="20" x2="420" y2="20" stroke="#1e3a5f" stroke-width="1" stroke-dasharray="4 4" stroke-opacity="0.5"/>

    <!-- Pulse Area Fill -->
    <path d="M 0 240 L 60 220 L 120 230 L 180 170 L 220 190 L 280 90 L 340 120 L 410 40 L 410 260 L 0 260 Z" fill="#0284c7" fill-opacity="0.08"/>

    <!-- Glowing Pulse Line Chart -->
    <path d="M 0 240 L 60 220 L 120 230 L 180 170 L 220 190 L 280 90 L 340 120 L 410 40" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#neon-glow)"/>

    <!-- Data points -->
    <circle cx="180" cy="170" r="4.5" fill="#38bdf8"/>
    <circle cx="280" cy="90" r="4.5" fill="#38bdf8"/>
    <circle cx="410" cy="40" r="6" fill="#38bdf8"/>
    <circle cx="410" cy="40" r="10" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6"/>
  </g>

  <!-- Bottom-left Branding -->
  <g transform="translate(100, 550)">
    <circle cx="8" cy="-7" r="5" fill="#38bdf8"/>
    <text x="24" y="0" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="-0.5">eManisha</text>
    <text x="150" y="0" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400">|</text>
    <text x="170" y="0" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400">emanisha.in</text>
  </g>
</svg>
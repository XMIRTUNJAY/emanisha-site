<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <pattern id="dot-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#2d333b" />
    </pattern>
  </defs>

  <!-- Deep charcoal background -->
  <rect width="1200" height="630" fill="#16181d"/>
  <rect width="1200" height="630" fill="url(#dot-grid)"/>

  <!-- Left Accent Tech Line (Electric Blue) -->
  <rect x="80" y="130" width="4" height="370" rx="2" fill="#00d4ff"/>

  <g transform="translate(120, 150)">
    <!-- Eyebrow -->
    <text x="0" y="0" fill="#00d4ff" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', Consolas, 'Roboto Mono', monospace" font-size="16" font-weight="700" letter-spacing="3">DE / AGENT ARCHITECTURE</text>

    <!-- White Headline -->
    <text x="0" y="65" fill="#f9fafb" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="62" font-weight="800" letter-spacing="-1">Pipelines that run themselves.</text>
    <text x="0" y="115" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400">Deterministic pipeline execution paired with adaptive LLM agents</text>

    <!-- Four Pipeline Stage Chips in a row -->
    <g transform="translate(0, 185)">
      <!-- Stage 1: Ingest -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="180" height="54" rx="27" fill="#21262d" stroke="#30363d" stroke-width="1.5"/>
        <circle cx="28" cy="27" r="10" fill="#22c55e" fill-opacity="0.2"/>
        <circle cx="28" cy="27" r="5" fill="#22c55e"/>
        <path d="M 24 27 L 27 30 L 33 24" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="52" y="34" fill="#f3f4f6" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', Consolas, monospace" font-size="18" font-weight="600">Ingest</text>
      </g>

      <!-- Connecting line 1 -->
      <line x1="180" y1="27" x2="220" y2="27" stroke="#388bfd" stroke-width="2" stroke-dasharray="4 4"/>

      <!-- Stage 2: Validate -->
      <g transform="translate(220, 0)">
        <rect x="0" y="0" width="190" height="54" rx="27" fill="#21262d" stroke="#30363d" stroke-width="1.5"/>
        <circle cx="28" cy="27" r="10" fill="#22c55e" fill-opacity="0.2"/>
        <circle cx="28" cy="27" r="5" fill="#22c55e"/>
        <path d="M 24 27 L 27 30 L 33 24" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="52" y="34" fill="#f3f4f6" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', Consolas, monospace" font-size="18" font-weight="600">Validate</text>
      </g>

      <!-- Connecting line 2 -->
      <line x1="410" y1="27" x2="450" y2="27" stroke="#388bfd" stroke-width="2" stroke-dasharray="4 4"/>

      <!-- Stage 3: Transform -->
      <g transform="translate(450, 0)">
        <rect x="0" y="0" width="200" height="54" rx="27" fill="#21262d" stroke="#30363d" stroke-width="1.5"/>
        <circle cx="28" cy="27" r="10" fill="#22c55e" fill-opacity="0.2"/>
        <circle cx="28" cy="27" r="5" fill="#22c55e"/>
        <path d="M 24 27 L 27 30 L 33 24" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="52" y="34" fill="#f3f4f6" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', Consolas, monospace" font-size="18" font-weight="600">Transform</text>
      </g>

      <!-- Connecting line 3 -->
      <line x1="650" y1="27" x2="690" y2="27" stroke="#388bfd" stroke-width="2" stroke-dasharray="4 4"/>

      <!-- Stage 4: Publish -->
      <g transform="translate(690, 0)">
        <rect x="0" y="0" width="190" height="54" rx="27" fill="#21262d" stroke="#30363d" stroke-width="1.5"/>
        <circle cx="28" cy="27" r="10" fill="#22c55e" fill-opacity="0.2"/>
        <circle cx="28" cy="27" r="5" fill="#22c55e"/>
        <path d="M 24 27 L 27 30 L 33 24" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="52" y="34" fill="#f3f4f6" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', Consolas, monospace" font-size="18" font-weight="600">Publish</text>
      </g>
    </g>

    <!-- Bottom Status / Identity -->
    <g transform="translate(0, 310)">
      <text x="0" y="0" fill="#e5e7eb" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700">eManisha</text>
      <text x="110" y="0" fill="#4b5563" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18">·</text>
      <text x="130" y="0" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', Consolas, monospace" font-size="16">status: operational (100% automated)</text>
    </g>
  </g>
</svg>
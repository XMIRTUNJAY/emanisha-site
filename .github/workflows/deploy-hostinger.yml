# Build and publish to GitHub Pages — https://emanisha.in
#
# Hostinger provides the domain and DNS only; all content and all server-side
# code are served by GitHub. On every push to main this workflow builds the
# site and publishes it through the official Pages actions, which also carry
# any Pages Functions (public/functions/) in the same artifact.
#
# DNS (at Hostinger): @ → 185.199.108-111.153 (GitHub), www → CNAME
#   xmirtunjay.github.io. See docs in repo for the migration notes.
#
# Pages: Settings → Pages, source = "GitHub Actions" (build type: workflow).
# The CNAME lives in public/CNAME, which Astro copies into dist/.

name: Build and publish to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. In-progress runs are not cancelled: a half-written
# site is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Checkout de-agent-platform
        uses: actions/checkout@v4
        with:
          repository: XMIRTUNJAY/de-agent-platform
          ref: main
          path: de-agent-platform

      - name: Build /de-agent/ section
        working-directory: de-agent-platform
        env:
          DEAGENT_BASE: /de-agent
          DEAGENT_SITE: https://emanisha.in
        run: |
          rm -rf src/pages/api
          npm ci
          npx astro build

      - name: Embed platform into public/de-agent
        run: |
          node tools/de-agent-rewrite.mjs de-agent-platform/dist
          mkdir -p public/de-agent
          cp -r de-agent-platform/dist/. public/de-agent/
          rm -f public/de-agent/robots.txt public/de-agent/sitemap-index.xml public/de-agent/sitemap-0.xml
          cp de-agent-platform/dist/sitemap-0.xml public/de-agent-sitemap.xml

      - name: Build Dhyaana app
        run: |
          cd apps/dhyaana
          npm ci
          npm run build
          cd ../..

      - name: Build site
        run: npm run build

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          # The site is large (the image library alone is tens of MB), so the
          # file sync needs longer than the 10 minute default.
          timeout: 3600000
          error_count: 30

# Deploy via Git — https://emanisha.in
#
# On every push to main: build the site, then publish the finished dist/
# contents to the `deploy` branch. Hostinger's Git integration (hPanel →
# Git) is connected to that branch and pulls it into public_html — no FTP.
#
# Hostinger Git settings:
#   repository : XMIRTUNJAY/emanisha-site
#   branch     : deploy
#   target dir : public_html

name: Build and publish deploy branch

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Checkout de-agent-platform
        uses: actions/checkout@v4
        with:
          repository: XMIRTUNJAY/de-agent-platform
          ref: main
          path: de-agent-platform

      - name: Build /de-agent/ section
        working-directory: de-agent-platform
        env:
          DEAGENT_BASE: /de-agent
          DEAGENT_SITE: https://emanisha.in
        run: |
          rm -rf src/pages/api
          npm ci
          npx astro build

      - name: Embed platform into public/de-agent
        run: |
          node tools/de-agent-rewrite.mjs de-agent-platform/dist
          mkdir -p public/de-agent
          cp -r de-agent-platform/dist/. public/de-agent/
          rm -f public/de-agent/robots.txt public/de-agent/sitemap-index.xml public/de-agent/sitemap-0.xml
          cp de-agent-platform/dist/sitemap-0.xml public/de-agent-sitemap.xml

      - name: Build Dhyaana app
        run: |
          cd apps/dhyaana
          npm ci
          npm run build
          cd ../..

      - name: Build site
        run: npm run build

      - name: Publish dist/ to the deploy branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: deploy
          force_orphan: true

# Deploy to Hostinger — https://emanisha.in
#
# On every push to main: build the Astro site, then FTP the dist/ contents
# to the hosting root (public_html). This REPLACES the old AI-builder site —
# make sure it is disconnected in hPanel before the first run.
#
# Required repo secrets (Settings → Secrets and variables → Actions → New):
#   FTP_SERVER    — e.g. ftp.emanisha.in or the Hostinger FTP hostname
#   FTP_USERNAME  — FTP account username
#   FTP_PASSWORD  — FTP account password
#
# If your FTP account is scoped directly to public_html, change
# server-dir below to just "/".

name: Deploy to Hostinger

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Deploy dist/ to public_html
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps-legacy
          server-dir: /public_html/
          local-dir: dist/
          dangerous-clean-slate: false

# Build and publish deploy branch — https://emanisha.in
#
# On every push to main: build the site, then publish the finished dist/
# contents to the `deploy` branch. That single published branch feeds:
#   1. GitHub Pages (Settings → Pages, source: branch `deploy`) — custom
#      domain emanisha.in via public/CNAME, which Astro copies to dist/.
#   2. Hostinger's Git integration (hPanel → Git), which historically pulled
#      this branch into public_html — no FTP. This reference is kept until
#      the Hostinger hosting subscription is cancelled; DNS for emanisha.in
#      points to GitHub Pages, so Hostinger no longer receives web traffic.
#
# DNS (at Hostinger): @ → 185.199.108-111.153 (GitHub), www → CNAME
#   xmirtunjay.github.io. See docs in repo for the migration notes.

name: Build and publish deploy branch

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Checkout de-agent-platform
        uses: actions/checkout@v4
        with:
          repository: XMIRTUNJAY/de-agent-platform
          ref: main
          path: de-agent-platform

      - name: Build /de-agent/ section
        working-directory: de-agent-platform
        env:
          DEAGENT_BASE: /de-agent
          DEAGENT_SITE: https://emanisha.in
        run: |
          rm -rf src/pages/api
          npm ci
          npx astro build

      - name: Embed platform into public/de-agent
        run: |
          node tools/de-agent-rewrite.mjs de-agent-platform/dist
          mkdir -p public/de-agent
          cp -r de-agent-platform/dist/. public/de-agent/
          rm -f public/de-agent/robots.txt public/de-agent/sitemap-index.xml public/de-agent/sitemap-0.xml
          cp de-agent-platform/dist/sitemap-0.xml public/de-agent-sitemap.xml

      - name: Build Dhyaana app
        run: |
          cd apps/dhyaana
          npm ci
          npm run build
          cd ../..

      - name: Build site
        run: npm run build

      - name: Publish dist/ to the deploy branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: deploy
          force_orphan: true

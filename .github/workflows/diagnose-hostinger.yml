# TEMPORARY diagnostic — Hostinger's FTP host is a bare IP (145.79.209.56).
# Find a vhost that routes to it, and confirm the PHP endpoint answers.
name: Probe Hostinger vhosts

on:
  workflow_dispatch:

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        run: |
          set +e
          H="${FTP_SERVER%%:*}"
          IP=$(getent ahostsv4 "$H" | awk '{print $1}' | head -1)
          echo "ip: $IP"

          echo "=== A. plain IP over HTTP (Host header defaults to the IP) ==="
          for p in "/" "/dhyaana/" "/api/contact.php"; do
            printf "  http://IP%-22s " "$p"
            curl -s --max-time 15 -o /tmp/o -w "%{http_code} %{content_type} %{size_download}b\n" "http://$IP$p" 2>&1 | tail -1
          done
          echo "  title: $(curl -s --max-time 15 "http://$IP/" | grep -oE '<title>[^<]*</title>' | head -1)"

          echo "=== B. same, with Host: emanisha.in over HTTP ==="
          for p in "/" "/api/contact.php"; do
            printf "  Host:emanisha.in %-14s " "$p"
            curl -s --max-time 15 -H 'Host: emanisha.in' -o /tmp/o -w "%{http_code} %{content_type} %{size_download}b\n" "http://$IP$p" 2>&1 | tail -1
          done
          echo "  body of /api/contact.php:"
          curl -s --max-time 15 -H 'Host: emanisha.in' "http://$IP/api/contact.php" | head -c 300 | sed 's/^/    /'; echo

          echo "=== C. HTTPS to the IP with SNI=emanisha.in ==="
          for p in "/" "/api/contact.php"; do
            printf "  https SNI %-18s " "$p"
            curl -s --max-time 15 --resolve "emanisha.in:443:$IP" -o /tmp/o -w "%{http_code} %{content_type} %{size_download}b\n" "https://emanisha.in$p" 2>&1 | tail -1
          done

          echo "=== D. does the IP answer with NO Host header at all? ==="
          curl -s --max-time 15 -H 'Host:' -o /tmp/o -w "  no-Host -> %{http_code} %{size_download}b\n" "http://$IP/" 2>&1 | tail -1
          grep -oE '<title>[^<]*</title>' /tmp/o | head -1 | sed 's/^/  /'

          echo "=== E. POST through Host header (the working route) ==="
          curl -s --max-time 25 -H 'Host: emanisha.in' -X POST \
            -H 'Content-Type: application/json' \
            -d '{"kind":"notify","source":"vhost-probe","name":"Probe","email":"mrxubr@gmail.com","message":"probe - ignore"}' \
            -o /tmp/p -w "  status=%{http_code} type=%{content_type}\n" "http://$IP/api/contact.php"
          head -c 200 /tmp/p | sed 's/^/  /'; echo

          echo "=== F. is there a hostname for this IP in reverse DNS? ==="
          getent hosts "$IP" | sed 's/^/  /'
          curl -s --max-time 10 "https://ipinfo.io/$IP/json" | head -c 400 | sed 's/^/  /'; echo

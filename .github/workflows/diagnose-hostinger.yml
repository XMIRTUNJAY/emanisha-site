# TEMPORARY diagnostic — read the actual response from Hostinger's
# /api/contact.php (it now returns 400, not 404: the endpoint is live).
name: Probe form endpoint

on:
  workflow_dispatch:

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        run: |
          set +e
          H="${FTP_SERVER%%:*}"
          IP=$(getent ahostsv4 "$H" | awk '{print $1}' | head -1)

          echo "=== GET /api/contact.php on Hostinger ==="
          curl -s --max-time 15 --resolve "emanisha.in:443:$IP" -D /tmp/hdr \
            -o /tmp/body -w "  status=%{http_code} type=%{content_type}\n" \
            "https://emanisha.in/api/contact.php"
          echo "--- headers ---"; grep -iE "^(server|content-type|x-|via)" /tmp/hdr | sed 's/^/  /'
          echo "--- body ---"; cat /tmp/body | sed 's/^/  /'; echo

          echo "=== POST a real submission (notify) ==="
          curl -s --max-time 25 --resolve "emanisha.in:443:$IP" -X POST \
            -H 'Content-Type: application/json' \
            -d '{"kind":"notify","source":"ci-probe","name":"Probe","email":"mrxubr@gmail.com","message":"probe - ignore"}' \
            -o /tmp/post -w "  status=%{http_code} type=%{content_type}\n" \
            "https://emanisha.in/api/contact.php"
          cat /tmp/post | sed 's/^/  /'; echo

          echo "=== same POST, but to the PUBLIC domain (DNS -> GitHub Pages) ==="
          curl -s --max-time 25 -X POST -H 'Content-Type: application/json' \
            -d '{"kind":"notify","source":"ci-probe-public","name":"Probe","email":"mrxubr@gmail.com","message":"probe - ignore"}' \
            -o /tmp/post2 -w "  status=%{http_code} type=%{content_type}\n" \
            "https://emanisha.in/api/contact.php"
          head -c 200 /tmp/post2 | sed 's/^/  /'; echo

          echo "=== is CORS needed? check what the browser would see ==="
          curl -s --max-time 15 --resolve "emanisha.in:443:$IP" -X OPTIONS \
            -H 'Origin: https://emanisha.in' -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: content-type' \
            -o /dev/null -D /tmp/cors -w "  OPTIONS status=%{http_code}\n" \
            "https://emanisha.in/api/contact.php"
          grep -i "access-control" /tmp/cors | sed 's/^/  /' || echo "  (no access-control headers)"

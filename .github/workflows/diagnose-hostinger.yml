# TEMPORARY diagnostic — locate where the site content lives on Hostinger's
# FTP, and whether the PHP endpoint exists there. Uses the repo's FTP secrets;
# no credentials are printed.
name: Locate Hostinger content

on:
  workflow_dispatch:

permissions: {}

jobs:
  locate:
    runs-on: ubuntu-latest
    steps:
      - name: Explore FTP tree
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set +e
          IP=$(getent ahostsv4 "$FTP_SERVER" | awk '{print $1}' | head -1)
          echo "ip: ${IP:-none}"
          echo "=== which vhost paths exist? ==="
          for p in "" "htdocs/" "public_html/" "domains/" "emanisha.in/" "emanisha.in/public_html/"; do
            echo "--- /$p ---"
            curl -s --max-time 20 "ftp://$FTP_SERVER/$p" --user "$FTP_USERNAME:$FTP_PASSWORD" 2>&1 | head -12
          done
          echo "=== does /api/contact.php exist anywhere obvious? ==="
          for p in "api/contact.php" "htdocs/api/contact.php" "public_html/api/contact.php" "emanisha.in/public_html/api/contact.php"; do
            printf "  %-42s " "$p"
            curl -s --max-time 15 -o /dev/null -w "%{http_code} %{size_download}b\n" \
              "ftp://$FTP_SERVER/$p" --user "$FTP_USERNAME:$FTP_PASSWORD" 2>&1 | tail -1
          done
          echo "=== HTTP: what does each candidate host return for /api/contact.php? ==="
          for host in emanisha.in www.emanisha.in; do
            printf "  %-18s " "$host"
            curl -s --max-time 15 --resolve "$host:443:$IP" -o /tmp/h.out \
              -w "%{http_code} %{content_type} " "https://$host/api/contact.php"
            head -c 40 /tmp/h.out | tr -d '\n'; echo
          done
          echo "=== does Hostinger answer for a vhost it does not host? ==="
          curl -s --max-time 15 --resolve "nonexistent-test-host.example:443:$IP" -o /dev/null \
            -w "  bogus vhost -> %{http_code} %{content_type}\n" "https://nonexistent-test-host.example/" 2>&1 | tail -1

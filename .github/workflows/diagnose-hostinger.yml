# TEMPORARY diagnostic — reveal the FTP hostname shape and find the served
# document root, so the PHP endpoint can be addressed. No credentials printed.
name: Find Hostinger docroot

on:
  workflow_dispatch:

permissions: {}

jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - name: Find
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set +e
          echo "=== ftp server shape (host part only) ==="
          echo "  host: ${FTP_SERVER%%:*}"
          echo "  has port: $(case "$FTP_SERVER" in *:*) echo yes;; *) echo no;; esac)"
          echo "  resolves to: $(getent ahostsv4 "${FTP_SERVER%%:*}" | awk '{print $1}' | head -3 | tr '\n' ' ')"

          echo "=== walk the ftp tree to find where the site lives ==="
          for d in "domains" "domains/emanisha.in" "domains/emanisha.in/public_html" "domains/emanisha.in/htdocs"; do
            echo "--- /$d ---"
            curl -s --max-time 20 "ftp://$FTP_SERVER/$d/" --user "$FTP_USERNAME:$FTP_PASSWORD" 2>&1 | head -14
          done

          echo "=== locate api/contact.php inside the tree ==="
          for d in "domains/emanisha.in/public_html" "domains/emanisha.in/public_html/api" "public_html"; do
            printf "  %-42s " "/$d/contact.php"
            curl -s --max-time 15 -o /dev/null -w "%{http_code} %{size_download}b\n" \
              "ftp://$FTP_SERVER/$d/contact.php" --user "$FTP_USERNAME:$FTP_PASSWORD" 2>&1 | tail -1
          done

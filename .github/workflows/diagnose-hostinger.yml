# TEMPORARY diagnostic — find where Hostinger serves emanisha.in from, and
# whether the api/ folder can be created. Uses the repo's FTP secrets.
name: Find Hostinger docroot

on:
  workflow_dispatch:

permissions: {}

jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - name: Find
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set +e
          H="${FTP_SERVER%%:*}"
          echo "=== listing every directory we can see ==="
          for d in "" "." "./" "domains/" "public_html/" "htdocs/" "www/" "home/"; do
            echo "--- /$d ---"
            curl -s --max-time 15 "ftp://$FTP_SERVER/$d" --user "$FTP_USERNAME:$FTP_PASSWORD" 2>&1 | head -12
          done

          echo "=== which dirs are listable? ==="
          for d in "domains/" "domains/emanisha.in/" "public_html/" "htdocs/" "www/" "home/"; do
            printf "  %-26s " "/$d"
            n=$(curl -s --max-time 12 "ftp://$FTP_SERVER/$d" --user "$FTP_USERNAME:$FTP_PASSWORD" 2>&1 | wc -l)
            echo "$n lines"
          done

          echo "=== can we create api/ ? (write test, then remove) ==="
          printf '<?php echo "ok";' > /tmp/probe.php
          curl -s --max-time 20 -T /tmp/probe.php "ftp://$FTP_SERVER/api/contact_probe.php" --user "$FTP_USERNAME:$FTP_PASSWORD" -w "upload=%{http_code}\n" 2>&1 | tail -2
          echo "=== retry listing api/ after upload ==="
          curl -s --max-time 12 "ftp://$FTP_SERVER/api/" --user "$FTP_USERNAME:$FTP_PASSWORD" 2>&1 | head -6

          echo "=== HTTP: does the site answer on a vhost like www2 / origin? ==="
          IP=$(getent ahostsv4 "$H" | awk '{print $1}' | head -1)
          for vh in emanisha.in; do
            for p in "/" "/dhyaana/" "/api/contact.php"; do
              printf "  %-22s " "$vh$p"
              curl -s --max-time 12 --resolve "$vh:443:$IP" -o /dev/null -w "%{http_code}\n" "https://$vh$p"
            done
          done

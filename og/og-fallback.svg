<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Ultra-minimal crisp white background -->
  <rect width="1200" height="630" fill="#ffffff"/>

  <!-- Centered Identity Block -->
  <g transform="translate(600, 290)">
    <!-- Brand Title: eManisha with small blue asterisk mark -->
    <g>
      <text x="-18" y="0" text-anchor="middle" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="82" font-weight="800" letter-spacing="-2">eManisha</text>
      
      <!-- Blue asterisk mark -->
      <g transform="translate(205, -60)">
        <path d="M 0 -16 L 0 16 M -14 -8 L 14 8 M -14 8 L 14 -8" stroke="#2563eb" stroke-width="6" stroke-linecap="round"/>
      </g>
    </g>

    <!-- Subline: "Small ideas. Thoughtful builds." in gray -->
    <text x="0" y="65" text-anchor="middle" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="400" letter-spacing="1">Small ideas. Thoughtful builds.</text>
  </g>

  <!-- Ultra-subtle bottom domain anchor -->
  <g transform="translate(600, 560)">
    <text x="0" y="0" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', Consolas, monospace" font-size="16" letter-spacing="3">EMANISHA.IN</text>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <style>
      
    </style>
  </defs>

  <!-- Warm cream background -->
  <rect width="1200" height="630" fill="#fdf6ec"/>

  <!-- Elegant terracotta border frame -->
  <rect x="40" y="40" width="1120" height="550" rx="16" fill="none" stroke="#8d452e" stroke-width="2" stroke-opacity="0.25"/>

  <!-- Decorative corner accents in terracotta -->
  <path d="M 60 90 L 60 60 L 90 60" fill="none" stroke="#8d452e" stroke-width="3" stroke-linecap="round"/>
  <path d="M 1140 90 L 1140 60 L 1110 60" fill="none" stroke="#8d452e" stroke-width="3" stroke-linecap="round"/>
  <path d="M 60 540 L 60 570 L 90 570" fill="none" stroke="#8d452e" stroke-width="3" stroke-linecap="round"/>
  <path d="M 1140 540 L 1140 570 L 1110 570" fill="none" stroke="#8d452e" stroke-width="3" stroke-linecap="round"/>

  <!-- Center Content -->
  <!-- Top Tag / Pill -->
  <g transform="translate(600, 130)">
    <rect x="-108" y="-18" width="238" height="36" rx="18" fill="#8d452e" fill-opacity="0.1"/>
    <circle cx="-73" cy="0" r="4" fill="#8d452e"/>
    <text x="-58" y="6" fill="#8d452e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="2">BOL MARATHI</text>
    <rect x="72" y="-8" width="40" height="16" rx="3" fill="#8d452e"/>
    <text x="79" y="4" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" letter-spacing="1">LIVE</text>
  </g>

  <!-- Large Devanagari Word "नमस्कार" -->
  <text x="600" y="300" text-anchor="middle" fill="#8d452e" font-family="'Tiro Devanagari Marathi', 'Mukta', 'Noto Sans Devanagari', 'Mangal', 'Nirmala UI', sans-serif" font-size="116" font-weight="700" letter-spacing="2">नमस्कार</text>

  <!-- Subtitle: Namaskar · Hello -->
  <text x="600" y="380" text-anchor="middle" fill="#5c2d1e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Georgia, serif" font-size="34" font-weight="500" letter-spacing="3">Namaskar · Hello</text>

  <!-- Subtle divider with sun motif -->
  <g transform="translate(600, 420)">
    <line x1="-120" y1="0" x2="-20" y2="0" stroke="#8d452e" stroke-width="1.5" stroke-opacity="0.3"/>
    <circle cx="0" cy="0" r="5" fill="#8d452e"/>
    <line x1="20" y1="0" x2="120" y2="0" stroke="#8d452e" stroke-width="1.5" stroke-opacity="0.3"/>
  </g>

  <!-- Descriptive subtext -->
  <text x="600" y="465" text-anchor="middle" fill="#7a4b3b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400">Interactive conversational language learning platform</text>

  <!-- Bottom Brand Footer -->
  <g transform="translate(600, 545)">
    <text x="0" y="0" text-anchor="middle" fill="#8d452e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" letter-spacing="1">eManisha · Marathi Learning Project</text>
  </g>
</svg>
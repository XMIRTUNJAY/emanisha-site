<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#ffffff" />

  <!-- Subtle border around card edge -->
  <rect x="24" y="24" width="1152" height="582" rx="20" fill="none" stroke="#f1f3f5" stroke-width="2" />

  <!-- Headline row with accent play triangle -->
  <g transform="translate(100, 190)">
    <!-- Red play button icon badge -->
    <g transform="translate(0, 8)">
      <rect width="56" height="56" rx="14" fill="#ff0000" />
      <!-- White play triangle -->
      <polygon points="22,18 40,28 22,38" fill="#ffffff" />
    </g>
    <!-- Headline -->
    <text x="76" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="64" font-weight="800" letter-spacing="-1.5" fill="#111827">Crew, not chaos.</text>
  </g>

  <!-- Subtitle -->
  <text x="100" y="295" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="500" fill="#6b7280">End-to-end multi-agent orchestration for digital content channels</text>

  <!-- 7 Stages Row: Strategy, Script, Thumbnail, SEO, Produce, Publish, Analytics -->
  <g transform="translate(100, 360)">
    <!-- Stage 1 -->
    <g transform="translate(0, 0)">
      <rect width="124" height="52" rx="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5" />
      <text x="62" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#1f2937" text-anchor="middle">Strategy</text>
    </g>
    <!-- Stage 2 -->
    <g transform="translate(142, 0)">
      <rect width="112" height="52" rx="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5" />
      <text x="56" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#1f2937" text-anchor="middle">Script</text>
    </g>
    <!-- Stage 3 -->
    <g transform="translate(272, 0)">
      <rect width="144" height="52" rx="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5" />
      <text x="72" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#1f2937" text-anchor="middle">Thumbnail</text>
    </g>
    <!-- Stage 4 -->
    <g transform="translate(434, 0)">
      <rect width="102" height="52" rx="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5" />
      <text x="51" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#1f2937" text-anchor="middle">SEO</text>
    </g>
    <!-- Stage 5 -->
    <g transform="translate(554, 0)">
      <rect width="126" height="52" rx="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5" />
      <text x="63" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#1f2937" text-anchor="middle">Produce</text>
    </g>
    <!-- Stage 6 -->
    <g transform="translate(698, 0)">
      <rect width="124" height="52" rx="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5" />
      <text x="62" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#1f2937" text-anchor="middle">Publish</text>
    </g>
    <!-- Stage 7 -->
    <g transform="translate(840, 0)">
      <rect width="140" height="52" rx="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5" />
      <text x="70" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#1f2937" text-anchor="middle">Analytics</text>
    </g>
  </g>

  <!-- Clean footer branding -->
  <text x="100" y="520" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#9ca3af" letter-spacing="2">AUTOMATED PRODUCTION PIPELINE</text>
</svg>
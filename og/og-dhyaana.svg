<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Warm parchment ground, matching the app brand ivory -->
  <rect width="1200" height="630" fill="#fff8ec"/>

  <!-- Soft parchment wash toward the edges -->
  <radialGradient id="glow" cx="50%" cy="38%" r="62%">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
    <stop offset="100%" stop-color="#f5e6cc" stop-opacity="0.55"/>
  </radialGradient>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Concentric mandala rings: the app's signature mark -->
  <g transform="translate(600, 252)" fill="none" stroke="#c66b3a">
    <circle cx="0" cy="0" r="152" stroke-width="1" stroke-opacity="0.14" stroke-dasharray="3 7"/>
    <circle cx="0" cy="0" r="118" stroke-width="1.5" stroke-opacity="0.26"/>
    <circle cx="0" cy="0" r="84" stroke-width="2" stroke-opacity="0.40"/>
    <circle cx="0" cy="0" r="50" stroke-width="2" stroke-opacity="0.55"/>
    <!-- Petal diamonds, echoing the .brand-mark geometry -->
    <g stroke-width="2" stroke-opacity="0.50">
      <rect x="-11" y="-11" width="22" height="22" transform="rotate(22.5)"/>
      <rect x="-11" y="-11" width="22" height="22" transform="rotate(67.5)"/>
      <rect x="-11" y="-11" width="22" height="22" transform="rotate(112.5)"/>
      <rect x="-11" y="-11" width="22" height="22" transform="rotate(157.5)"/>
    </g>
    <!-- Calm core -->
    <circle cx="0" cy="0" r="16" fill="#c66b3a" stroke="none"/>
  </g>

  <!-- Typography -->
  <g transform="translate(600, 492)" text-anchor="middle">
    <text x="0" y="0" fill="#c66b3a"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-size="19" font-weight="700" letter-spacing="9">DHYAANA</text>
    <text x="0" y="52" fill="#3b2314"
          font-family="Georgia, Cambria, 'Times New Roman', serif"
          font-size="42" font-weight="400" letter-spacing="-0.5">Return to the stillness within.</text>
    <text x="0" y="90" fill="#735f51"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-size="17" font-weight="400" letter-spacing="1.4">MEDITATION · BREATHWORK · REFLECTION</text>
  </g>

  <!-- Brand credit -->
  <text x="600" y="596" text-anchor="middle" fill="#9a887b"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="14" font-weight="600" letter-spacing="2">eMANISHA</text>
</svg>

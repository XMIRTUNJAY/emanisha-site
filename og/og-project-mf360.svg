<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background: warm paper #faf6ef -->
  <rect width="1200" height="630" fill="#faf6ef" />

  <!-- Subtle editorial outer border -->
  <rect x="40" y="40" width="1120" height="550" rx="4" fill="none" stroke="#e8ded1" stroke-width="1.5" />

  <!-- Eyebrow: MF360 · MUTUAL FUNDS -->
  <g transform="translate(110, 160)">
    <!-- Small green accent dot -->
    <circle cx="6" cy="-6" r="4.5" fill="#15803d" />
    <text x="24" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" letter-spacing="3.5" fill="#166534">MF360 · MUTUAL FUNDS</text>
  </g>

  <!-- Serif Headline: "Money math, proven." -->
  <text x="110" y="260" font-family="Georgia, 'Times New Roman', 'Playfair Display', serif" font-size="70" font-weight="700" letter-spacing="-1" fill="#18181b">Money math, proven.</text>

  <!-- Thin gold rule line -->
  <line x1="110" y1="310" x2="680" y2="310" stroke="#d97706" stroke-width="1.5" />

  <!-- Shield-check mark and editorial finance highlights -->
  <g transform="translate(110, 360)">
    <!-- Shield-check mark vector -->
    <g transform="translate(0, 0)">
      <path d="M 28 6 C 28 6 14 12 4 12 C 4 36 12 56 28 66 C 44 56 52 36 52 12 C 42 12 28 6 28 6 Z" fill="#fef3c7" stroke="#b45309" stroke-width="2" stroke-linejoin="round" />
      <!-- Check mark inside shield -->
      <path d="M 19 35 L 26 42 L 38 27" fill="none" stroke="#166534" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Editorial finance subtext & pillars -->
    <g transform="translate(76, 18)">
      <text x="0" y="10" font-family="Georgia, serif" font-size="22" font-style="italic" fill="#3f3f46">Institutional-grade portfolio analytics &amp; performance attribution</text>
      <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500" fill="#71717a">Rolling Alpha · Sharpe &amp; Sortino Ratios · Downside Capture · Factsheet Verification</text>
    </g>
  </g>

  <!-- Bottom editorial stamp -->
  <text x="110" y="525" font-family="Georgia, serif" font-size="15" font-style="italic" fill="#a1a1aa">Quantitative Rigor for Advisory &amp; Family Offices</text>
</svg>
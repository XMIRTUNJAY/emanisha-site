<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Subtle luxury gradient in navy -->
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2540" />
      <stop offset="100%" stop-color="#06182c" />
    </linearGradient>
  </defs>

  <!-- Deep navy background #0a2540 -->
  <rect width="1200" height="630" fill="url(#navyGrad)" />

  <!-- Subtle grid/accent border -->
  <rect x="36" y="36" width="1128" height="558" rx="16" fill="none" stroke="#1e3a5f" stroke-width="1.2" opacity="0.6" />

  <!-- Gold eyebrow: MF360 ACADEMY -->
  <g transform="translate(100, 150)">
    <!-- Small gold accent star/diamond -->
    <polygon points="6,0 12,6 6,12 0,6" fill="#f59e0b" />
    <text x="24" y="9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" letter-spacing="4" fill="#fbbf24">MF360 ACADEMY</text>
  </g>

  <!-- White headline: "Learn funds. Build wealth." -->
  <text x="100" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="64" font-weight="700" letter-spacing="-1.5" fill="#ffffff">Learn funds. Build wealth.</text>

  <!-- Three small document rows (Course, Calculator, Certificate) with check dots -->
  <g transform="translate(100, 310)">
    <!-- Row 1: Course -->
    <g transform="translate(0, 0)">
      <rect width="640" height="64" rx="12" fill="#103254" stroke="#1d4872" stroke-width="1.2" />
      <!-- Document icon -->
      <g transform="translate(24, 18)">
        <rect width="20" height="26" rx="3" fill="none" stroke="#93c5fd" stroke-width="2" />
        <line x1="5" y1="8" x2="15" y2="8" stroke="#93c5fd" stroke-width="1.5" />
        <line x1="5" y1="14" x2="15" y2="14" stroke="#93c5fd" stroke-width="1.5" />
      </g>
      <!-- Label -->
      <text x="62" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" fill="#ffffff">Structured Curriculum &amp; Fund Masterclasses</text>
      <!-- Check dot -->
      <circle cx="600" cy="32" r="9" fill="#10b981" />
      <path d="M 596 32 L 599 35 L 605 29" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Row 2: Calculator -->
    <g transform="translate(0, 80)">
      <rect width="640" height="64" rx="12" fill="#103254" stroke="#1d4872" stroke-width="1.2" />
      <!-- Calculator / Grid icon -->
      <g transform="translate(24, 18)">
        <rect width="20" height="26" rx="3" fill="none" stroke="#fcd34d" stroke-width="2" />
        <line x1="5" y1="7" x2="15" y2="7" stroke="#fcd34d" stroke-width="2" />
        <circle cx="7" cy="14" r="1.5" fill="#fcd34d" />
        <circle cx="13" cy="14" r="1.5" fill="#fcd34d" />
        <circle cx="7" cy="20" r="1.5" fill="#fcd34d" />
        <circle cx="13" cy="20" r="1.5" fill="#fcd34d" />
      </g>
      <!-- Label -->
      <text x="62" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" fill="#ffffff">Interactive SIP &amp; Asset Allocation Calculators</text>
      <!-- Check dot -->
      <circle cx="600" cy="32" r="9" fill="#10b981" />
      <path d="M 596 32 L 599 35 L 605 29" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Row 3: Certificate -->
    <g transform="translate(0, 160)">
      <rect width="640" height="64" rx="12" fill="#103254" stroke="#1d4872" stroke-width="1.2" />
      <!-- Certificate ribbon / doc icon -->
      <g transform="translate(24, 18)">
        <rect width="20" height="26" rx="3" fill="none" stroke="#a7f3d0" stroke-width="2" />
        <circle cx="10" cy="12" r="4" fill="none" stroke="#a7f3d0" stroke-width="1.5" />
        <path d="M 8 16 L 6 22 L 10 20 L 14 22 L 12 16" fill="#a7f3d0" />
      </g>
      <!-- Label -->
      <text x="62" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" fill="#ffffff">Accredited Investor Competency Certificate</text>
      <!-- Check dot -->
      <circle cx="600" cy="32" r="9" fill="#10b981" />
      <path d="M 596 32 L 599 35 L 605 29" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>

  <!-- Bottom note -->
  <text x="100" y="580" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#64748b" letter-spacing="1">SELF-PACED MASTERY · PRACTICAL SIMULATIONS</text>
</svg>